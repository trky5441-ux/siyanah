<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">

<style>

.code { left: 70px; top: 90px; font-size: 26px; line-height: 1.8; }

.qrs { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
.qrs figure { margin: 0; text-align: center; }
